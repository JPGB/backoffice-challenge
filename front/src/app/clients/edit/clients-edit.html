<section class="clients-edit">
  <div class="clients-edit-container">
    <span class="clients-edit-container-title">Edit Client</span>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          class="form-control"
          id="name"
          required
          [(ngModel)]="client.name"
          name="name"
        />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="text"
          class="form-control"
          id="email"
          required
          [(ngModel)]="client.email"
          name="email"
        />
      </div>
      <div class="form-group">
        <label for="identification">Identification</label>
        <input
          type="text"
          class="form-control"
          id="identification"
          required
          [(ngModel)]="client.identification"
          name="identification"
        />
      </div>
      <div class="form-group">
        <label for="agency">Agency</label>
        <input
          type="text"
          class="form-control"
          id="agency"
          required
          [(ngModel)]="client.agency"
          name="agency"
        />
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>
</section>
