<section class="clients-create">
  <div class="clients-create-container">
    <span class="clients-create-container-title">Create New Client</span>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          class="form-control"
          id="name"
          required
          [(ngModel)]="client.name"
          name="name"
        />
        <!-- <div
      [hidden]="client.name.valid || client.name.pristine"
      class="alert alert-danger"
    >
      Name is required
    </div> -->
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="text"
          class="form-control"
          id="email"
          required
          [(ngModel)]="client.email"
          name="email"
        />
        <!-- <div
      [hidden]="client.name.valid || client.name.pristine"
      class="alert alert-danger"
    >
      Name is required
    </div> -->
      </div>
      <div class="form-group">
        <label for="identification">Identification</label>
        <input
          type="text"
          class="form-control"
          id="identification"
          required
          [(ngModel)]="client.identification"
          name="identification"
        />
        <!-- <div
      [hidden]="client.name.valid || client.name.pristine"
      class="alert alert-danger"
    >
      Name is required
    </div> -->
      </div>
      <div class="form-group">
        <label for="agency">Agency</label>
        <input
          type="text"
          class="form-control"
          id="agency"
          required
          [(ngModel)]="client.agency"
          name="agency"
        />
        <!-- <div
      [hidden]="client.name.valid || client.name.pristine"
      class="alert alert-danger"
    >
      Name is required
    </div> -->
      </div>

      <button type="submit">Submit</button>
    </form>
  </div>
</section>
